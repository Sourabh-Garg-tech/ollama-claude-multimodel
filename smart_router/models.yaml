models:
  - name: deepseek-v4-pro:cloud
    label: Architecture & Complex Decisions
    classification: planning
    cost_input_per_1k: 0.005
    cost_output_per_1k: 0.015
    quality_score: 10
    speed_score: 5
    context_window: 128000
    fallback: deepseek-v4-flash:cloud

  - name: deepseek-v4-flash:cloud
    label: Reasoning & Cheap Loops
    classification: default
    cost_input_per_1k: 0.002
    cost_output_per_1k: 0.006
    quality_score: 8
    speed_score: 9
    context_window: 64000
    fallback: glm-5.1:cloud

  - name: kimi-k2.6:cloud
    label: Implementation & Coding
    classification: code
    cost_input_per_1k: 0.003
    cost_output_per_1k: 0.009
    quality_score: 8
    speed_score: 7
    context_window: 128000
    fallback: deepseek-v4-flash:cloud

  - name: glm-5.1:cloud
    label: Quick Lookups & Stability
    classification: lookup
    cost_input_per_1k: 0.001
    cost_output_per_1k: 0.003
    quality_score: 6
    speed_score: 10
    context_window: 32000
    fallback: null

weights:
  quality_weight: 1.0
  cost_weight: 1.0
  context_bonus: 2.0
  speed_bonus: 1.5

thresholds:
  lookup_max_chars: 200
  complex_min_chars: 2000
  low_budget_percent: 20
  critical_budget_percent: 5

budget:
  daily_input_tokens: 100000
  daily_output_tokens: 200000
  hard_stop_on_critical: true

routing_matrix:
  planning:
    healthy: deepseek-v4-pro:cloud
    low_budget: glm-5.1:cloud
  code:
    healthy: kimi-k2.6:cloud
    low_budget: glm-5.1:cloud
  lookup:
    healthy: glm-5.1:cloud
    low_budget: glm-5.1:cloud
  complex:
    healthy: deepseek-v4-pro:cloud
    low_budget: glm-5.1:cloud
  default:
    healthy: deepseek-v4-flash:cloud
    low_budget: glm-5.1:cloud
