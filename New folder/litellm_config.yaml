model_list:
  - model_name: deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 30
      max_retries: 2

  - model_name: deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 120
      max_retries: 2

  - model_name: kimi-k2.6
    litellm_params:
      model: openai/kimi-k2.6
      api_base: https://api.moonshot.ai/v1
      api_key: os.environ/KIMI_API_KEY
      timeout: 60
      max_retries: 2

  - model_name: glm-5.1
    litellm_params:
      model: openai/glm-5.1
      api_base: https://open.bigmodel.cn/api/paas/v4
      api_key: os.environ/GLM_API_KEY
      timeout: 300
      max_retries: 2

# Infrastructure-level fallbacks only.
# Semantic escalation is handled by LangGraph, not here.
litellm_settings:
  fallbacks:
    - deepseek-v4-flash:
        - deepseek-v4-pro        # Flash unavailable → Pro
    - kimi-k2.6:
        - deepseek-v4-pro        # Kimi unavailable → Pro
    - glm-5.1:
        - deepseek-v4-pro        # GLM unavailable → Pro

  context_window_fallbacks:
    - deepseek-v4-flash:
        - deepseek-v4-pro        # Flash 1M exceeded → Pro 1M (different quota)
    - kimi-k2.6:
        - deepseek-v4-pro        # Kimi 256K exceeded → Pro 1M
    - glm-5.1:
        - deepseek-v4-pro        # GLM 203K exceeded → Pro 1M

  content_policy_fallbacks:
    - deepseek-v4-flash:
        - kimi-k2.6
    - deepseek-v4-pro:
        - kimi-k2.6

  num_retries: 2
  request_timeout: 300
  set_verbose: false

# Proxy server settings
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL    # optional, for logging
  store_model_in_db: false

# Per-model spend limits (optional guardrails)
router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 2
  cooldown_time: 30
